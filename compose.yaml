# TreeAudit — Docker Compose.
#
# Start it with ./treeaudit: it validates the audited folder on the host before
# mounting it (docs/DECISIONS.md D-008). Security rules: docs/SECURITY.md.
# Never add ':z' or ':Z' to a mount, nor privileged mode, nor the Docker socket.

name: treeaudit

x-hardening: &hardening
  user: "${TREEAUDIT_UID:?start TreeAudit with ./treeaudit (it passes your user id)}:${TREEAUDIT_GID:?start TreeAudit with ./treeaudit}"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=256m,mode=1777"]
  # Bounds a runaway or fork bomb; the app needs only a few threads.
  pids_limit: 256

services:
  app:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    image: treeaudit-app:local
    # Sees the audited data: internal network only, no outbound access and no
    # published port (D-020). It is reached through the gateway.
    networks: [internal]
    environment:
      # SQLite's temporary files (large sorts, VACUUM): the data volume, not
      # the small /tmp of the container (D-043).
      SQLITE_TMPDIR: /data/tmp
      # Host time zone, for the local time in archive names (D-032).
      TZ: "${TREEAUDIT_TZ:-UTC}"
    # The audited folders are mounted by overrides, read-only, after validation
    # on the host: compose.root.yaml (TREEAUDIT_ROOT_PATH) and the generated
    # .treeaudit-disks.json (external disks, D-033).
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    restart: "no"

  # Publishes the port on the host loopback and relays TCP to app (D-020).
  # It has network access but no volume: it never sees any audited data.
  gateway:
    <<: *hardening
    image: treeaudit-app:local
    command: ["gateway", "--upstream-host", "app", "--upstream-port", "8765"]
    networks: [internal, edge]
    ports:
      - "127.0.0.1:${TREEAUDIT_PORT:-8765}:8765"
    depends_on: [app]
    restart: "no"

  # Validates a host path against the host mount table, received on stdin.
  # No network, no volume: it never sees the host filesystem.
  check:
    <<: *hardening
    image: treeaudit-app:local
    profiles: [tools]
    network_mode: none
    entrypoint: ["treeaudit", "roots", "check", "--no-fs-checks", "--mountinfo", "-"]

  # Detects the host's external disks from its mount table (stdin) and sysfs,
  # and prints the compose file mounting the accepted ones read-only (D-033).
  # No network, no volume.
  check-disks:
    <<: *hardening
    image: treeaudit-app:local
    profiles: [tools]
    network_mode: none
    entrypoint: ["treeaudit", "disks", "detect", "--mountinfo", "-"]

  # Same, for the archive directory (D-032).
  check-archive:
    <<: *hardening
    image: treeaudit-app:local
    profiles: [tools]
    network_mode: none
    entrypoint: ["treeaudit", "archive", "check", "--no-fs-checks", "--mountinfo", "-"]

  # Tests and quality tools. The repository (not an audited folder) is mounted at /app.
  dev:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    image: treeaudit-dev:local
    profiles: [dev]
    network_mode: none
    environment:
      HOME: /tmp
    working_dir: /app
    volumes:
      - type: bind
        source: .
        target: /app

networks:
  # No route outside the host: containers on it cannot reach the Internet.
  internal:
    internal: true
  # Used only by the gateway, to publish its port on the host.
  edge: {}
