# TreeAudit — catalogue of "parasite" entries (D-023).
#
# A rule names the folders or files it targets (exact `names` or simple `globs`),
# a base confidence (0-100) and evidence that raises or lowers it. Evidence is
# checked against the scan index only: the disk is never read again.
#
# Evidence kinds:
#   child / child_glob          a direct child with this name / matching this glob
#   sibling / sibling_glob      an entry next to the target (same parent)
#   all_files_glob              every file below the target matches (at least one)
#   any_file_glob               at least one file below the target matches
#   any_file_not_glob           at least one file below the target does NOT match
#
# Recreate commands are templates run from the parent directory; the only
# placeholder is {name} (the target's name, shell-quoted). They are displayed,
# never executed (D-025). User-facing texts are in French (D-016).
#
# Globs: *, ? and [abc] only (no negated classes), matched case-sensitively.

# --- Python -------------------------------------------------------------------------

[[rule]]
id = "python-pycache"
label = "Cache de bytecode Python"
target = "dir"
names = ["__pycache__"]
base = 85
explanation = "Créé automatiquement par Python à l'import des modules ; recréé à la prochaine exécution."
recreate_note = "Recréé automatiquement par Python."
evidence = [
  { kind = "all_files_glob", value = "*.py[co]", weight = 15, label = "ne contient que des fichiers .pyc" },
  { kind = "any_file_not_glob", value = "*.py[co]", weight = -50, label = "contient d'autres fichiers que des .pyc" },
]

[[rule]]
id = "python-venv"
label = "Environnement virtuel Python"
target = "dir"
names = [".venv", "venv", "env", ".virtualenv", "virtualenv"]
base = 15
explanation = "Copie locale de l'interpréteur et des paquets installés ; se recrée si la liste des dépendances est connue (requirements.txt, pyproject.toml)."
evidence = [
  { kind = "child", value = "pyvenv.cfg", weight = 60, label = "fichier pyvenv.cfg présent" },
  { kind = "child", value = "lib", weight = 5, label = "dossier lib présent" },
  { kind = "child", value = "bin", weight = 5, label = "dossier bin présent" },
  { kind = "sibling", value = "requirements.txt", weight = 5, label = "requirements.txt à côté" },
  { kind = "sibling", value = "pyproject.toml", weight = 5, label = "pyproject.toml à côté" },
]
recreate = [
  { when_sibling = "requirements.txt", command = "python3 -m venv {name} && {name}/bin/pip install -r requirements.txt" },
  { when_sibling = "pyproject.toml", command = "python3 -m venv {name} && {name}/bin/pip install -e ." },
  { command = "python3 -m venv {name}" },
]

[[rule]]
id = "python-tool-caches"
label = "Cache d'outil Python"
target = "dir"
names = [".pytest_cache", ".mypy_cache", ".ruff_cache", ".hypothesis", ".pytype", ".pyre"]
base = 95
explanation = "Cache d'un outil de test ou d'analyse ; recréé à la prochaine exécution de l'outil."
recreate_note = "Recréé automatiquement par l'outil."

[[rule]]
id = "python-tox"
label = "Environnements tox / nox"
target = "dir"
names = [".tox", ".nox"]
base = 85
explanation = "Environnements de test créés par tox ou nox ; recréés à la prochaine exécution."
recreate = [
  { when_sibling = "tox.ini", command = "tox" },
  { when_sibling = "noxfile.py", command = "nox" },
]

[[rule]]
id = "jupyter-checkpoints"
label = "Points de sauvegarde Jupyter"
target = "dir"
names = [".ipynb_checkpoints"]
base = 80
explanation = "Copies automatiques des notebooks ; utiles seulement pour revenir à une version antérieure non enregistrée."

[[rule]]
id = "python-egg-info"
label = "Métadonnées de paquet Python"
target = "dir"
globs = ["*.egg-info"]
names = [".eggs"]
base = 85
explanation = "Générées lors de l'installation ou de la construction d'un paquet."
evidence = [
  { kind = "sibling", value = "setup.py", weight = 10, label = "setup.py à côté" },
  { kind = "sibling", value = "pyproject.toml", weight = 10, label = "pyproject.toml à côté" },
]
recreate = [{ command = "python3 -m pip install -e ." }]

[[rule]]
id = "python-coverage-html"
label = "Rapport de couverture HTML"
target = "dir"
names = ["htmlcov"]
base = 70
explanation = "Rapport généré par coverage.py ; se régénère avec les tests."
evidence = [
  { kind = "sibling", value = ".coverage", weight = 20, label = "fichier .coverage à côté" },
]
recreate = [{ command = "coverage html" }]

[[rule]]
id = "python-coverage-data"
label = "Données de couverture"
target = "file"
names = [".coverage"]
base = 85
explanation = "Données brutes de coverage.py ; recréées en relançant les tests."

[[rule]]
id = "python-dist"
label = "Paquets Python construits"
target = "dir"
names = ["dist", "build"]
base = 10
explanation = "Sortie de construction d'un projet Python ; se reconstruit, sauf si des fichiers y ont été ajoutés à la main."
evidence = [
  { kind = "sibling", value = "pyproject.toml", weight = 55, label = "pyproject.toml à côté" },
  { kind = "sibling", value = "setup.py", weight = 55, label = "setup.py à côté" },
  { kind = "child_glob", value = "*.whl", weight = 15, label = "contient des .whl" },
]
recreate = [{ command = "python3 -m build" }]

# --- JavaScript / web ---------------------------------------------------------------

[[rule]]
id = "node-modules"
label = "Dépendances Node.js"
target = "dir"
names = ["node_modules"]
base = 50
explanation = "Paquets installés par npm, yarn ou pnpm ; se réinstallent depuis package.json."
evidence = [
  { kind = "sibling", value = "package.json", weight = 40, label = "package.json à côté" },
  { kind = "child", value = ".package-lock.json", weight = 5, label = "index npm .package-lock.json présent" },
]
recreate = [
  { when_sibling = "package-lock.json", command = "npm ci" },
  { when_sibling = "yarn.lock", command = "yarn install --frozen-lockfile" },
  { when_sibling = "pnpm-lock.yaml", command = "pnpm install --frozen-lockfile" },
  { when_sibling = "package.json", command = "npm install" },
]

[[rule]]
id = "bower-components"
label = "Dépendances Bower"
target = "dir"
names = ["bower_components"]
base = 50
explanation = "Paquets installés par Bower (outil ancien) ; se réinstallent depuis bower.json."
evidence = [
  { kind = "sibling", value = "bower.json", weight = 40, label = "bower.json à côté" },
]
recreate = [{ when_sibling = "bower.json", command = "bower install" }]

[[rule]]
id = "js-framework-caches"
label = "Cache de framework web"
target = "dir"
names = [".next", ".nuxt", ".svelte-kit", ".parcel-cache", ".turbo", ".angular", ".sass-cache", ".docusaurus", ".vercel", ".expo"]
base = 70
explanation = "Cache ou sortie de construction d'un framework web ; recréé au prochain lancement ou à la prochaine construction."
evidence = [
  { kind = "sibling", value = "package.json", weight = 25, label = "package.json à côté" },
]

[[rule]]
id = "js-dist"
label = "Sortie de construction JavaScript"
target = "dir"
names = ["dist", "build", "out", "storybook-static"]
base = 10
explanation = "Fichiers produits par la construction ; se reconstruisent, sauf si le dossier est versionné ou modifié à la main."
evidence = [
  { kind = "sibling", value = "package.json", weight = 55, label = "package.json à côté" },
]
recreate = [{ when_sibling = "package.json", command = "npm run build" }]

