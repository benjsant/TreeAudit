# --- Operating system leftovers -----------------------------------------------------

[[rule]]
id = "macos-archive-leftovers"
label = "Restes d'archive macOS"
target = "dir"
names = ["__MACOSX"]
base = 90
explanation = "Métadonnées macOS ajoutées dans les archives ZIP ; inutiles en dehors de macOS."
evidence = [
  { kind = "all_files_glob", value = "._*", weight = 10, label = "ne contient que des fichiers ._*" },
]

[[rule]]
id = "macos-volume-metadata"
label = "Métadonnées de disque macOS"
target = "dir"
names = [".Spotlight-V100", ".fseventsd", ".Trashes", ".TemporaryItems", ".DocumentRevisions-V100"]
base = 85
explanation = "Créés par macOS sur les disques externes (index, journal, corbeille) ; inutiles sous Linux. .Trashes contient des fichiers supprimés."

[[rule]]
id = "macos-ds-store"
label = "Réglages d'affichage macOS"
target = "file"
names = [".DS_Store"]
base = 95
explanation = "Créé par le Finder de macOS pour mémoriser l'affichage d'un dossier."

[[rule]]
id = "macos-appledouble"
label = "Fichier AppleDouble macOS"
target = "file"
globs = ["._*"]
base = 80
explanation = "Métadonnées macOS associées au fichier du même nom sans le préfixe ._ ; inutiles sous Linux."

[[rule]]
id = "windows-thumbnails"
label = "Cache de miniatures Windows"
target = "file"
names = ["Thumbs.db", "ehthumbs.db", "ehthumbs_vista.db"]
base = 95
explanation = "Cache de miniatures créé par l'Explorateur Windows."

[[rule]]
id = "windows-desktop-ini"
label = "Réglages de dossier Windows"
target = "file"
names = ["desktop.ini"]
base = 90
explanation = "Personnalisation d'affichage d'un dossier sous Windows (icône, nom affiché)."

[[rule]]
id = "windows-recycle-bin"
label = "Corbeille Windows d'un disque"
target = "dir"
names = ["$RECYCLE.BIN", "RECYCLER"]
base = 60
explanation = "Corbeille Windows d'un disque externe : contient des fichiers supprimés. À vider seulement si tu n'en as plus besoin."

[[rule]]
id = "linux-trash"
label = "Corbeille Linux d'un disque"
target = "dir"
globs = [".Trash-*"]
base = 60
explanation = "Corbeille d'un disque externe sous Linux : contient des fichiers supprimés. À vider seulement si tu n'en as plus besoin."

[[rule]]
id = "kde-directory"
label = "Réglages de dossier KDE"
target = "file"
names = [".directory"]
base = 85
explanation = "Réglages d'affichage d'un dossier dans Dolphin (KDE)."

# --- Editors and office suites --------------------------------------------------------

[[rule]]
id = "office-lock-files"
label = "Fichier de verrou de suite bureautique"
target = "file"
globs = ["~$*", ".~lock.*#"]
base = 80
explanation = "Verrou laissé par Microsoft Office ou LibreOffice quand un document est ouvert ; orphelin si le logiciel n'est plus ouvert."

[[rule]]
id = "vim-swap"
label = "Fichier d'échange Vim"
target = "file"
globs = ["*.swp", "*.swo"]
base = 55
explanation = "Fichier d'échange de Vim. Il peut contenir des modifications non enregistrées après un plantage : vérifier avant de supprimer."

[[rule]]
id = "editor-backups"
label = "Copie de sauvegarde d'éditeur"
target = "file"
globs = ["*~"]
base = 55
explanation = "Copie automatique d'un fichier avant modification (Emacs, gedit…). Vérifier que l'original existe."

# --- LaTeX ---------------------------------------------------------------------------

[[rule]]
id = "latex-auxiliary"
label = "Fichier auxiliaire LaTeX"
target = "file"
globs = ["*.aux", "*.toc", "*.lof", "*.lot", "*.bbl", "*.blg", "*.fls", "*.fdb_latexmk", "*.synctex.gz", "*.nav", "*.snm", "*.out"]
base = 20
explanation = "Généré par la compilation d'un document LaTeX ; recréé à la prochaine compilation."
evidence = [
  { kind = "sibling_glob", value = "*.tex", weight = 65, label = "fichier .tex à côté" },
]
recreate_note = "Recréé à la prochaine compilation du document."

# --- Copied libraries (ambiguous: candidates for the local AI, phase 9) ----------------

[[rule]]
id = "vendored-web-library"
label = "Bibliothèque web recopiée"
