<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TreeAudit{% endblock %} · TreeAudit</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>
  <header class="top">
    <a class="brand" href="/">🌳 TreeAudit</a>
    <a class="button small" href="/scan/new">+ Nouvelle analyse</a>
  </header>
  {% if running_job %}
  <p class="notice info" role="status">
    ⏳ Analyse en cours : {{ running_job.label }} — <a href="/jobs/current">voir l'avancement</a>
  </p>
  {% endif %}
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  <footer>
    TreeAudit ne supprime jamais rien de lui-même : il te propose des commandes, c'est toi
    qui décides de les lancer.
  </footer>
</body>
</html>
