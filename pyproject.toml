[project]
name = "treeaudit"
version = "1.0.0rc1"
description = "Local, read-only file and directory audit tool for Linux"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
]

[project.scripts]
treeaudit = "treeaudit.entry:run"

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "pyyaml>=6",
  "types-PyYAML>=6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treeaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
# The repository, for the development tools (tools/subfolder_bench, D-066).
pythonpath = ["."]
filterwarnings = [
  "error",
  # Starlette asks to move its TestClient from httpx to httpx2; tests only, harmless.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "."]  # "." for the development tools (tools/)

[tool.ruff.lint]
# D1: every public module, class, function and method has a docstring (only
# its presence is checked, not its form). __init__ and magic methods are
# described by their class.
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF", "D1"]
ignore = ["D105", "D107"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert, fixed temporary paths and refused bind addresses;
# their names say what they check.
"tests/**" = ["S101", "S104", "S108", "D1"]
# Held-out cases frozen before the algorithm (D-050, D-066): never edited.
"tools/subfolder_bench/cases.py" = ["D101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
# The development bench too (D-066): it was type-checked inside the package.
packages = ["treeaudit", "tools.subfolder_bench"]
